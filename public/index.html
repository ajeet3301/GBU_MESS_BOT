<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mess Reminder — Never Miss a Meal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --card-bg: #0a0a0c;
    --fg: #f8fafc;
    --mut: #94a3b8;
    --ac: #10b981;
    --ac-hover: #34d399;
    --border: #1e1e24;
    --shadow: 0 25px 50px -12px rgb(0 0 0 / 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 44px 36px;
    box-shadow: var(--shadow);
  }
  #d {
    color: var(--ac);
    margin: 0 0 14px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  h1 {
    font-size: clamp(28px, 6vw, 36px);
    line-height: 1.15;
    margin: 0 0 12px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  p {
    margin: 0 0 32px;
    color: var(--mut);
    font-size: 15px;
    line-height: 1.6;
  }
  form {
    display: flex;
    background: #121216;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.25s ease;
  }
  input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 15px;
    padding: 15px 18px;
  }
  input::placeholder { color: var(--mut); opacity: 0.5; }
  input:focus { outline: none; }
  form:focus-within {
    border-color: var(--ac);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 20%, transparent);
  }
  button {
    border: 0;
    background: var(--ac);
    color: #000000;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    padding: 0 22px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  button:hover { background: var(--ac-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #m {
    min-height: 24px;
    margin-top: 16px;
    font-size: 14px;
    font-weight: 500;
  }
  .ok { color: var(--ac); }
  .er { color: #f87171; }
  .tg {
    display: block;
    margin-top: 20px;
    padding: 14px;
    text-align: center;
    color: var(--fg);
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: all 0.2s ease;
  }
  .tg:hover { border-color: var(--ac); color: var(--ac); }
</style>
</head>
<body>
<main>
  <p id="d"></p>
  <h1>Never miss a mess menu again.</h1>
  <p>Drop your email to get timely meal reminders delivered straight to your inbox before service begins.</p>
  <form id="f">
    <input id="e" type="email" placeholder="name@example.com" aria-label="Email" required autocomplete="email">
    <button id="b">Notify me</button>
  </form>
  <div id="m" role="status"></div>
  <a class="tg" href="https://t.me/gbu_mess_bot" target="_blank" rel="noopener">✈ Get reminders on Telegram now</a>
</main>
<script>
d.textContent = new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
f.onsubmit = async (x) => {
  x.preventDefault(); b.disabled = true; m.className = ""; m.textContent = "";
  try {
    const r = await fetch("/api/subscribe", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: e.value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    m.className = "ok"; m.textContent = "You're all set! We'll email you when reminders start."; f.reset();
  } catch (err) {
    m.className = "er"; m.textContent = err.message || "Something went wrong. Please try again.";
  }
  b.disabled = false;
};
</script>
</body>
</html>
